name: Reusable - Build Windows x86

on:
  workflow_call:
    inputs:
      version:
        description: Version used in artifact names
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Component and client (Windows x86)
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test catalog generator and client packager
        run: npm test

      - name: Check Pawn package with sampctl
        env:
          GH_TOKEN: ${{ github.token }}
          SAMPCTL_GITHUB_TOKEN: ${{ github.token }}
        run: |
          $toolDir = Join-Path $env:RUNNER_TEMP 'sampctl'
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          $archive = 'sampctl_1.14.1_windows_amd64.tar.gz'
          gh release download 1.14.1 --repo Southclaws/sampctl --dir $toolDir `
            --pattern $archive --pattern 'sampctl_1.14.1_checksums.txt'
          if ($LASTEXITCODE -ne 0) { throw 'sampctl download failed' }
          $checksumLine = Get-Content (Join-Path $toolDir 'sampctl_1.14.1_checksums.txt') |
            Where-Object { ($_ -split '\s+')[-1] -eq $archive }
          if (-not $checksumLine) { throw 'Missing sampctl checksum' }
          $expected = ($checksumLine -split '\s+')[0]
          if ((Get-FileHash (Join-Path $toolDir $archive) -Algorithm SHA256).Hash -ne $expected) {
            throw 'sampctl checksum mismatch'
          }
          tar -xzf (Join-Path $toolDir $archive) -C $toolDir
          if ($LASTEXITCODE -ne 0) { throw 'sampctl extraction failed' }
          & (Join-Path $toolDir 'sampctl.exe') ensure
          if ($LASTEXITCODE -ne 0) { throw 'sampctl ensure failed' }
          & (Join-Path $toolDir 'sampctl.exe') build
          if ($LASTEXITCODE -ne 0) { throw 'sampctl build failed' }

      - name: Check public build manifest
        run: |
          $manifest = Get-Content src/generated/manifest.hpp -Raw
          if ($manifest -notmatch 'kConfigured\s*=\s*false\s*;') {
            throw 'Public builds require the unconfigured manifest. Keep package-specific manifests out of releases.'
          }

      - name: Fetch native dependencies
        run: ./scripts/bootstrap-native.ps1

      - name: Build Release and run native tests
        run: |
          $buildArgs = @{ Configuration = 'Release' }
          if ($env:RELEASE_VERSION -match '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            $buildArgs.Version = $env:RELEASE_VERSION
          }
          ./scripts/build.ps1 @buildArgs

      - name: Package and verify release assets
        run: ./scripts/package-release.ps1 -Version $env:RELEASE_VERSION

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: omp-drip-windows-x86-${{ inputs.version }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
